name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r labs/05-docker-compose/requirements-dev.txt

      - name: Run tests
        working-directory: labs/05-docker-compose
        run: python -m pytest --cov=app --cov-report=term-missing -v test_app.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: sufiyankhan10/homelab-notes-api
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./labs/05-docker-compose
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Connect to Tailscale
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Configure SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HOMELAB_SSH_KEY: ${{ secrets.HOMELAB_SSH_KEY }}
          HOMELAB_KNOWN_HOSTS: ${{ secrets.HOMELAB_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$HOMELAB_SSH_KEY" > "$HOME/.ssh/homelab_deploy"
          chmod 600 "$HOME/.ssh/homelab_deploy"
          printf '%s\n' "$HOMELAB_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy to homelab
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          ssh \
            -i "$HOME/.ssh/homelab_deploy" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            sufiyan@100.88.34.81 \
            "sha-${GITHUB_SHA}"
