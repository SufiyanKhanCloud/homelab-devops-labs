name: CI

on:
  push:
    paths:
      - "labs/05-docker-compose/**"
  pull_request:
    paths:
      - "labs/05-docker-compose/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r labs/05-docker-compose/requirements-dev.txt

      - name: Run tests
        working-directory: labs/05-docker-compose
        run: python -m pytest --cov=app --cov-report=term-missing -v test_app.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: sufiyankhan10/homelab-notes-api
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./labs/05-docker-compose
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.70.0"
        run: |
          set -euo pipefail

          ARCHIVE="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          BASE_URL="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"

          mkdir -p "$HOME/.local/bin"
          cd "$RUNNER_TEMP"

          curl --fail --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 2 \
            "$BASE_URL/$ARCHIVE" -o "$ARCHIVE"

          curl --fail --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 2 \
            "$BASE_URL/trivy_${TRIVY_VERSION}_checksums.txt" \
            -o checksums.txt

          awk -v file="$ARCHIVE" '$2 == file {print}' checksums.txt \
            | sha256sum --check -

          tar -xzf "$ARCHIVE" trivy

          install -m 0755 trivy "$HOME/.local/bin/trivy"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          trivy --version

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sufiyankhan10/homelab-notes-api:sha-${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          severity: CRITICAL,HIGH
          skip-setup-trivy: true

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] || docker push "$tag"
          done <<< "$IMAGE_TAGS"
