name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r labs/05-docker-compose/requirements-dev.txt

      - name: Run tests
        working-directory: labs/05-docker-compose
        run: python -m pytest --cov=app --cov-report=term-missing -v test_app.py

      - name: Build Docker image
        working-directory: labs/05-docker-compose
        run: docker build -t notes-app:ci .
